<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客戶關係管理系統 - 財務顧問團隊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800;900&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --paper:#faf9f6; --card:#ffffff; --ink:#22252b; --ink-soft:#7a7f8a; --line:#edece6;
  --assets:#5271e0; --assets-bg:#eef1fd; --assets-deep:#37509e;
  --income:#dc9a26; --income-bg:#fdf4e0; --income-deep:#9c6c14;
  --expense:#2b9e86; --expense-bg:#e7f7f3; --expense-deep:#1f7566;
  --loan:#c15c50; --loan-bg:#fbece9; --loan-deep:#963f35;
}
body{ font-family:'Noto Sans TC', sans-serif; background-color: var(--paper); }
.font-display{ font-family:'Manrope','Noto Sans TC', sans-serif; }
.no-scrollbar::-webkit-scrollbar { display: none; }
.no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
/* 移除 forwards 以避免 Safari 動畫渲染消失的 Bug */
.animate-fade { animation: fadeIn 0.3s ease-out; }
.animate-slide-up { animation: slideUp 0.4s ease-out; }
@keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
@keyframes slideUp { 0% { opacity: 0; transform: translateY(15px); } 100% { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect } = React;

// ============ Supabase 設定 ============
const SUPABASE_URL = 'https://roiupxausybcfplexwsk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_Jlalv3BaKF4-2TRpDRx7CQ_X5ILexY_';
const supabaseClient = (window.supabase && SUPABASE_URL.startsWith('http')) 
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) 
  : null;

// 定義行銷流程階段
const PIPELINE_STAGES = [
  { id: '名單收集', color: '#94a3b8', bg: '#f1f5f9' },
  { id: '初次接觸', color: '#8b5cf6', bg: '#ede9fe' },
  { id: '需求分析', color: '#3b82f6', bg: '#dbeafe' },
  { id: '建議書遞交', color: '#dc9a26', bg: '#fdf4e0' },
  { id: '簽約成交', color: '#10b981', bg: '#d1fae5' },
  { id: '售後服務', color: '#14b8a6', bg: '#ccfbf1' },
  { id: '暫緩跟進', color: '#ef4444', bg: '#fee2e2' }
];

// ============ 登入畫面 ============
const LoginScreen = () => {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [successMsg, setSuccessMsg] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault(); setError(''); setSuccessMsg('');
    if (!supabaseClient) { setError('系統尚未設定資料庫連線，請聯絡管理員。'); return; }
    setLoading(true);
    if (isSignUp) {
      const { data, error: err } = await supabaseClient.auth.signUp({ email, password });
      setLoading(false);
      if (err) setError(err.message);
      else { setSuccessMsg('註冊成功！'); setIsSignUp(false); setPassword(''); }
    } else {
      const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
      setLoading(false);
      if (err) setError(err.message === 'Invalid login credentials' ? '帳號或密碼不正確' : err.message);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--paper)'}}>
      <form onSubmit={handleSubmit} className="w-full max-w-sm p-8 rounded-3xl animate-slide-up" style={{background:'var(--card)', boxShadow:'0 20px 50px rgba(34,37,43,0.12)'}}>
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4 bg-gradient-to-br from-indigo-500 to-purple-600">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <h1 className="font-display text-lg font-extrabold" style={{color:'var(--ink)'}}>客戶追蹤管理系統</h1>
          <p className="text-[12px] font-num font-bold tracking-[0.2em] uppercase mt-1 text-gray-400">{isSignUp ? '建立新帳號' : '團隊登入'}</p>
        </div>
        <div className="space-y-3">
          <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full rounded-xl p-3.5 text-sm outline-none bg-gray-50 border border-gray-200" />
          <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="密碼 (至少 6 位數)" minLength="6" className="w-full rounded-xl p-3.5 text-sm outline-none bg-gray-50 border border-gray-200" />
        </div>
        {error && <p className="text-[13px] font-bold mt-3 text-red-500">{error}</p>}
        {successMsg && <p className="text-[13px] font-bold mt-3 text-green-600">{successMsg}</p>}
        <button type="submit" disabled={loading} className="w-full mt-6 py-3.5 rounded-full font-bold text-sm text-white transition-all bg-[#5271e0] hover:bg-[#37509e] disabled:opacity-50">
          {loading ? '處理中...' : (isSignUp ? '註冊帳號' : '登入系統')}
        </button>
        <div className="text-center mt-5">
          <button type="button" onClick={() => { setIsSignUp(!isSignUp); setError(''); setSuccessMsg(''); }} className="text-[12px] font-bold transition-colors" style={{color:'var(--assets-deep)'}}>
            {isSignUp ? '已經有帳號了？點此登入' : '還沒有帳號？點此註冊'}
          </button>
        </div>
      </form>
    </div>
  );
};

// ============ CRM 主系統 ============
const CRMApp = ({ session }) => {
  const currentUserId = session?.user?.id;
  const [clients, setClients] = useState([]);
  const [loading, setLoading] = useState(true);
  
  // Modal 狀態
  const [isModalOpen, setIsModalOpen] = useState(false);
  const [editingClient, setEditingClient] = useState(null);
  const [newInteraction, setNewInteraction] = useState({ date: new Date().toISOString().split('T')[0], type: '實體面談', note: '' });

  useEffect(() => { fetchClients(); }, []);

  const fetchClients = async () => {
    try {
      setLoading(true);
      const { data, error } = await supabaseClient.from('crm_clients').select('*').eq('user_id', currentUserId).order('updated_at', { ascending: false });
      
      if (!error && Array.isArray(data)) {
        setClients(data);
      } else if (error) {
        console.error('獲取客戶資料失敗:', error);
        if(error.code === '42P01') alert('錯誤：尚未建立 crm_clients 資料表。請在 Supabase 執行 SQL 語法建立資料表。');
      } else {
        setClients([]); // 防呆
      }
    } catch (err) {
      console.error('未預期的錯誤:', err);
      setClients([]);
    } finally {
      setLoading(false);
    }
  };

  const openNewClientModal = () => {
    setEditingClient({
      isNew: true, client_name: '', stage: '初次接觸',
      data: { phone: '', email: '', background: '', interactions: [] }
    });
    setIsModalOpen(true);
  };

  const openEditClientModal = (client) => {
    const clientData = (typeof client.data === 'object' && client.data !== null) ? client.data : {};
    const interactions = Array.isArray(clientData.interactions) ? clientData.interactions : [];
    
    setEditingClient({ 
      ...client, 
      data: { ...clientData, interactions }
    });
    setIsModalOpen(true);
  };

  const handleSaveClient = async () => {
    if (!editingClient.client_name?.trim()) return alert('請輸入客戶姓名');
    
    const clientRecord = {
      user_id: currentUserId,
      client_name: editingClient.client_name,
      stage: editingClient.stage || '初次接觸',
      data: editingClient.data || {},
      updated_at: new Date().toISOString()
    };

    if (editingClient.isNew) {
      const { error } = await supabaseClient.from('crm_clients').insert([clientRecord]);
      if (error) alert('新增失敗：' + error.message);
    } else {
      const { error } = await supabaseClient.from('crm_clients').update(clientRecord).eq('id', editingClient.id);
      if (error) alert('更新失敗：' + error.message);
    }
    
    setIsModalOpen(false);
    fetchClients();
  };

  const handleAddInteraction = () => {
    if (!newInteraction.note?.trim()) return alert('請輸入紀錄內容');
    const updatedClient = { ...editingClient };
    const interaction = { id: Date.now(), ...newInteraction };
    
    const existingInteractions = Array.isArray(updatedClient.data.interactions) ? updatedClient.data.interactions : [];
    updatedClient.data.interactions = [interaction, ...existingInteractions];
    
    setEditingClient(updatedClient);
    setNewInteraction({ date: new Date().toISOString().split('T')[0], type: '實體面談', note: '' });
  };

  const handleDeleteInteraction = (id) => {
    if(!confirm('確定要刪除這筆紀錄嗎？')) return;
    const updatedClient = { ...editingClient };
    
    const existingInteractions = Array.isArray(updatedClient.data.interactions) ? updatedClient.data.interactions : [];
    updatedClient.data.interactions = existingInteractions.filter(i => i.id !== id);
    
    setEditingClient(updatedClient);
  };
  
  const handleDeleteClient = async () => {
    if(!confirm('確定要刪除這位客戶嗎？此動作無法復原！')) return;
    const { error } = await supabaseClient.from('crm_clients').delete().eq('id', editingClient.id);
    if (error) alert('刪除失敗：' + error.message);
    else {
      setIsModalOpen(false);
      fetchClients();
    }
  };

  const safeClients = Array.isArray(clients) ? clients : [];

  return (
    <div className="min-h-screen flex flex-col xl:h-screen animate-fade" style={{background:'var(--paper)'}}>
      {/* ===== Header ===== */}
      <div className="px-6 py-4 flex justify-between items-center z-40 shrink-0 bg-white border-b border-[#edece6]">
        <div className="flex items-center gap-3.5">
          <a href="index.html" className="flex items-center justify-center w-10 h-10 rounded-full transition-colors hover:bg-gray-100 border-2 border-gray-100 text-gray-500" title="返回系統首頁">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          </a>
          <div className="w-10 h-10 rounded-2xl flex items-center justify-center bg-gradient-to-br from-indigo-500 to-purple-600 text-white shadow-md">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          </div>
          <div><h1 className="font-display text-lg font-extrabold text-[#22252b]">客戶追蹤與行銷漏斗</h1><p className="text-[11px] font-num font-bold tracking-[0.1em] text-[#b7b3a8] uppercase">Client Pipeline Management</p></div>
        </div>
        <div className="flex items-center gap-4">
          <span className="text-[12px] font-bold text-gray-400 hidden sm:block">{session?.user?.email || '未知使用者'}</span>
          <button onClick={() => supabaseClient.auth.signOut()} className="px-4 py-2.5 rounded-full font-bold text-sm bg-gray-100 text-gray-600 hover:bg-gray-200 transition-colors hidden sm:block">登出</button>
          <button onClick={openNewClientModal} className="px-5 py-2.5 rounded-full font-bold text-sm text-white shadow-lg transition-transform hover:-translate-y-0.5" style={{background:'var(--assets)'}}>＋ 新增客戶</button>
        </div>
      </div>

      {/* ===== 看板區域 (Kanban Board) ===== */}
      <div className="flex-1 overflow-x-auto overflow-y-hidden p-6 flex gap-6 no-scrollbar">
        {loading ? (
          <div className="p-10 text-gray-400 font-bold">資料載入中...</div>
        ) : (
          PIPELINE_STAGES.map(stage => {
            const stageClients = safeClients.filter(c => c.stage === stage.id);
            return (
              <div key={stage.id} className="flex-shrink-0 w-[300px] flex flex-col h-full animate-slide-up">
                {/* 階段標題 */}
                <div className="flex justify-between items-center mb-4 px-1">
                  <div className="flex items-center gap-2">
                    <span className="w-2.5 h-2.5 rounded-full" style={{background: stage.color}}></span>
                    <h3 className="font-bold text-[15px] text-[#22252b]">{stage.id}</h3>
                  </div>
                  <span className="text-[12px] font-bold text-gray-400 bg-gray-200 px-2 py-0.5 rounded-full">{stageClients.length}</span>
                </div>
                
                {/* 客戶卡片列表 */}
                <div className="flex-1 overflow-y-auto no-scrollbar pb-10 space-y-3">
                  {stageClients.map(client => {
                    const cData = (typeof client.data === 'object' && client.data !== null) ? client.data : {};
                    const interactions = Array.isArray(cData.interactions) ? cData.interactions : [];
                    const latestNote = interactions[0]?.note;
                    const phoneNum = cData.phone;

                    return (
                      <div key={client.id} onClick={() => openEditClientModal(client)} className="bg-white p-4 rounded-2xl shadow-sm border border-[#edece6] cursor-pointer hover:shadow-md hover:-translate-y-0.5 transition-all group">
                        <div className="flex justify-between items-start mb-2">
                          <div className="font-extrabold text-[16px] text-[#22252b] group-hover:text-blue-600 transition-colors">{client.client_name || '未命名'}</div>
                          {interactions.length > 0 && (
                            <div className="text-[11px] text-gray-400 bg-gray-100 px-2 py-0.5 rounded-md">
                              紀錄 {interactions.length}
                            </div>
                          )}
                        </div>
                        <div className="text-[13px] text-gray-500 mb-2 truncate">
                          {phoneNum || '尚未填寫電話'}
                        </div>
                        {latestNote && (
                          <div className="text-[12px] bg-gray-50 p-2 rounded-lg text-gray-600 truncate border border-gray-100">
                            <span className="font-bold text-gray-400 mr-1">最新:</span> 
                            {latestNote}
                          </div>
                        )}
                      </div>
                    );
                  })}
                  
                  {stageClients.length === 0 && (
                    <div className="border-2 border-dashed border-gray-200 rounded-2xl p-6 text-center text-sm font-bold text-gray-400">尚無客戶</div>
                  )}
                </div>
              </div>
            );
          })
        )}
      </div>

      {/* ===== 客戶資料 Modal ===== */}
      {isModalOpen && editingClient && (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/40 backdrop-blur-sm animate-fade">
          <div className="bg-white w-full max-w-4xl max-h-[90vh] rounded-[2rem] shadow-2xl flex flex-col overflow-hidden animate-slide-up">
            
            {/* Modal Header */}
            <div className="px-8 py-5 border-b border-[#edece6] flex justify-between items-center shrink-0 bg-gray-50">
              <h2 className="font-display font-extrabold text-xl text-[#22252b] flex items-center gap-3">
                {editingClient.isNew ? '新增客戶資料' : `客戶檔案：${editingClient.client_name}`}
                {!editingClient.isNew && (
                  <button onClick={handleDeleteClient} className="text-[12px] bg-red-100 text-red-600 px-3 py-1 rounded-full font-bold hover:bg-red-200 transition-colors">刪除客戶</button>
                )}
              </h2>
              <button onClick={() => setIsModalOpen(false)} className="w-8 h-8 rounded-full bg-gray-200 flex items-center justify-center text-gray-500 hover:bg-gray-300 transition-colors">✕</button>
            </div>

            {/* Modal Content - 分左右兩欄 */}
            <div className="flex-1 overflow-y-auto p-8 grid grid-cols-1 md:grid-cols-2 gap-8 custom-scrollbar">
              
              {/* 左欄：基本設定 */}
              <div className="space-y-5">
                <div className="flex items-center gap-2 mb-6 border-b pb-2"><span className="text-xl">👤</span><h3 className="font-bold text-[16px]">基本資料與進度</h3></div>
                
                <div>
                  <label className="block text-[13px] font-bold text-gray-500 mb-1.5">目前行銷階段 <span className="text-red-500">*</span></label>
                  <select value={editingClient.stage || '初次接觸'} onChange={e => setEditingClient({...editingClient, stage: e.target.value})} className="w-full bg-[#f8f9fa] border-2 border-gray-200 p-3 rounded-xl font-bold text-gray-800 outline-none focus:border-blue-500 transition-colors">
                    {PIPELINE_STAGES.map(s => <option key={s.id} value={s.id}>{s.id}</option>)}
                  </select>
                </div>

                <div>
                  <label className="block text-[13px] font-bold text-gray-500 mb-1.5">客戶姓名 <span className="text-red-500">*</span></label>
                  <input type="text" value={editingClient.client_name || ''} onChange={e => setEditingClient({...editingClient, client_name: e.target.value})} className="w-full bg-[#f8f9fa] border-2 border-gray-200 p-3 rounded-xl font-bold outline-none focus:border-blue-500 transition-colors" placeholder="王大明" />
                </div>

                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-[13px] font-bold text-gray-500 mb-1.5">聯絡電話</label>
                    <input type="text" value={editingClient.data?.phone || ''} onChange={e => setEditingClient({...editingClient, data: {...(editingClient.data || {}), phone: e.target.value}})} className="w-full bg-[#f8f9fa] border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 text-sm transition-colors" placeholder="0912-345678" />
                  </div>
                  <div>
                    <label className="block text-[13px] font-bold text-gray-500 mb-1.5">Email</label>
                    <input type="email" value={editingClient.data?.email || ''} onChange={e => setEditingClient({...editingClient, data: {...(editingClient.data || {}), email: e.target.value}})} className="w-full bg-[#f8f9fa] border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 text-sm transition-colors" placeholder="email@example.com" />
                  </div>
                </div>

                <div>
                  <label className="block text-[13px] font-bold text-gray-500 mb-1.5">背景描述 / 需求備註</label>
                  <textarea rows="4" value={editingClient.data?.background || ''} onChange={e => setEditingClient({...editingClient, data: {...(editingClient.data || {}), background: e.target.value}})} className="w-full bg-[#f8f9fa] border-2 border-gray-200 p-3 rounded-xl outline-none focus:border-blue-500 text-sm resize-none transition-colors" placeholder="例如：已婚，兩個小孩，目前想規劃退休金..."></textarea>
                </div>
              </div>

              {/* 右欄：面談與互動紀錄 */}
              <div className="space-y-5">
                <div className="flex items-center gap-2 mb-6 border-b pb-2"><span className="text-xl">📝</span><h3 className="font-bold text-[16px]">互動與面談紀錄</h3></div>
                
                {/* 新增紀錄區塊 */}
                <div className="bg-blue-50/50 p-4 rounded-2xl border border-blue-100">
                  <div className="grid grid-cols-2 gap-3 mb-3">
                    <input type="date" value={newInteraction.date || ''} onChange={e => setNewInteraction({...newInteraction, date: e.target.value})} className="bg-white border border-gray-200 p-2 rounded-lg text-sm outline-none transition-colors focus:border-blue-400" />
                    <select value={newInteraction.type || '實體面談'} onChange={e => setNewInteraction({...newInteraction, type: e.target.value})} className="bg-white border border-gray-200 p-2 rounded-lg text-sm outline-none transition-colors focus:border-blue-400">
                      <option>實體面談</option><option>線上會議</option><option>電話聯絡</option><option>Line/訊息</option>
                    </select>
                  </div>
                  <textarea rows="2" value={newInteraction.note || ''} onChange={e => setNewInteraction({...newInteraction, note: e.target.value})} className="w-full bg-white border border-gray-200 p-3 rounded-xl outline-none focus:border-blue-400 text-sm resize-none mb-3 transition-colors" placeholder="請輸入本次討論重點或待辦事項..."></textarea>
                  <button onClick={handleAddInteraction} className="w-full py-2 bg-blue-600 text-white font-bold rounded-xl text-sm hover:bg-blue-700 transition-colors">＋ 記錄下來</button>
                </div>

                {/* 歷史紀錄列表 */}
                <div className="space-y-3 mt-4 max-h-[300px] overflow-y-auto no-scrollbar pr-2">
                  {(!Array.isArray(editingClient.data?.interactions) || editingClient.data.interactions.length === 0) ? (
                    <div className="text-center text-gray-400 text-sm py-4">目前尚無互動紀錄</div>
                  ) : (
                    editingClient.data.interactions.map((interaction) => (
                      <div key={interaction.id} className="bg-white border border-gray-200 p-4 rounded-2xl relative group hover:border-blue-200 transition-colors">
                        <button onClick={() => handleDeleteInteraction(interaction.id)} className="absolute top-3 right-3 text-gray-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity text-sm">刪除</button>
                        <div className="flex items-center gap-2 mb-2">
                          <span className="font-num text-[12px] font-bold text-gray-500">{interaction.date}</span>
                          <span className="text-[11px] font-bold bg-gray-100 text-gray-600 px-2 py-0.5 rounded-md">{interaction.type}</span>
                        </div>
                        <div className="text-[14px] text-gray-700 whitespace-pre-wrap leading-relaxed">{interaction.note}</div>
                      </div>
                    ))
                  )}
                </div>
              </div>

            </div>

            {/* Modal Footer */}
            <div className="px-8 py-4 border-t border-[#edece6] flex justify-end gap-3 bg-gray-50 shrink-0">
              <button onClick={() => setIsModalOpen(false)} className="px-6 py-2.5 rounded-full font-bold text-sm bg-white border border-gray-300 text-gray-600 hover:bg-gray-100 transition-colors">取消</button>
              <button onClick={handleSaveClient} className="px-8 py-2.5 rounded-full font-bold text-sm text-white bg-[#22252b] hover:bg-black shadow-lg transition-transform hover:-translate-y-0.5">儲存檔案</button>
            </div>

          </div>
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [session, setSession] = useState(undefined);
  const [configError, setConfigError] = useState(false);

  useEffect(() => {
    if (!supabaseClient) { 
      setConfigError(true);
      setSession(null); 
      return; 
    }
    
    // 初始化 Session
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    
    // 監聽登入狀態改變
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => {
      setSession(newSession);
    });
    
    return () => {
      if(listener && listener.subscription) listener.subscription.unsubscribe();
    };
  }, []);

  if (configError) return (<div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--paper)'}}><div className="max-w-md p-8 rounded-3xl text-center" style={{background:'var(--card)', boxShadow:'0 20px 50px rgba(34,37,43,0.12)'}}><p className="font-bold text-base mb-2 text-red-500">⚠ 尚未設定資料庫連線</p><p className="text-sm text-gray-500">請確認程式碼中的 Supabase URL 是否正確。</p></div></div>);
  
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center bg-[#faf9f6] text-gray-500 font-bold">系統載入中...</div>;
  if (!session || !session.user) return <LoginScreen />;
  
  return <CRMApp session={session} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
