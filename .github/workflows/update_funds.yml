name: Auto Update Funds History

on:
  schedule:
    # 每月 5 號 UTC 00:00（台灣時間 08:00）自動執行
    - cron: '0 0 5 * *'
  workflow_dispatch: # 允許在 GitHub 介面手動觸發

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Run scraper
        run: python fetch_funds.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add funds_data.json
          git diff --staged --quiet || (git commit -m "Auto update funds_data.json" && git push)
