// 金額輸入框
const MoneyInput = ({ value, onChange, placeholder, className, style }) => {
  const format = (v) => {
    if (v === '' || v === null || v === undefined) return '';
    const n = Number(v);
    return isNaN(n) ? '' : n.toLocaleString('en-US');
  };
  const [display, setDisplay] = useState(format(value));
  useEffect(() => { setDisplay(format(value)); }, [value]);
  const handle = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, '');
    setDisplay(raw === '' ? '' : Number(raw).toLocaleString('en-US'));
    onChange(raw);
  };
  return (<input type="text" inputMode="numeric" value={display} onChange={handle} placeholder={placeholder} className={className} style={style} />);
};

// 圖示元件

const CategoryChip = ({ icon, label, zh, tone }) => { const c = TONE_COLORS[tone]; return (<div className="flex w-fit items-center gap-2.5 pl-3 pr-4 py-2 rounded-full" style={{background: c.bg}}>{icon}<span className="font-num text-[11px] font-bold tracking-[0.18em]" style={{color: c.deep}}>{label.toUpperCase()}</span><span className="text-[13px] font-bold" style={{color:'#22252b'}}>{zh}</span></div>); };

// ============ 登入畫面 ============
const LoginScreen = ({ onLogin }) => {
  const [isSignUp, setIsSignUp] = useState(false);
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [error, setError] = useState('');
  const [successMsg, setSuccessMsg] = useState('');
  const [loading, setLoading] = useState(false);

  const handleSubmit = async (e) => {
    e.preventDefault(); setError(''); setSuccessMsg('');
    if (!SUPABASE_URL.startsWith('http')) { setError('系統尚未設定資料庫連線，請聯絡管理員。'); return; }
    setLoading(true);
    if (isSignUp) {
      const { data, error: err } = await supabaseClient.auth.signUp({ email, password });
      setLoading(false);
      if (err) setError(err.message);
      else { setSuccessMsg('註冊成功！若系統有開啟信箱驗證，請先至信箱收信。'); setIsSignUp(false); setPassword(''); }
    } else {
      const { error: err } = await supabaseClient.auth.signInWithPassword({ email, password });
      setLoading(false);
      if (err) setError(err.message === 'Invalid login credentials' ? '帳號或密碼不正確' : err.message);
    }
  };

  return (
    <div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--paper)'}}>
      <form onSubmit={handleSubmit} className="w-full max-w-sm p-8 rounded-3xl" style={{background:'var(--card)', boxShadow:'0 20px 50px rgba(34,37,43,0.12)'}}>
        <div className="flex flex-col items-center mb-8">
          <div className="w-14 h-14 rounded-2xl flex items-center justify-center mb-4" style={{background:'linear-gradient(135deg, var(--income), var(--assets))'}}><IconChart color="#ffffff" /></div>
          <h1 className="font-display text-lg font-extrabold" style={{color:'var(--ink)'}}>全方位財務分配報表</h1>
          <p className="text-[12px] font-num font-bold tracking-[0.2em] uppercase mt-1" style={{color:'#b7b3a8'}}>{isSignUp ? '建立新帳號' : '團隊登入'}</p>
        </div>
        <div className="space-y-3">
          <input type="email" required value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email" className="w-full rounded-xl p-3.5 text-sm outline-none" style={{background:'#f5f4ef', border:'1.5px solid #e7e5dd', color:'var(--ink)'}} />
          <input type="password" required value={password} onChange={e=>setPassword(e.target.value)} placeholder="密碼 (至少 6 位數)" minLength="6" className="w-full rounded-xl p-3.5 text-sm outline-none" style={{background:'#f5f4ef', border:'1.5px solid #e7e5dd', color:'var(--ink)'}} />
        </div>
        {error && <p className="text-[13px] font-bold mt-3" style={{color:'var(--loan)'}}>{error}</p>}
        {successMsg && <p className="text-[13px] font-bold mt-3" style={{color:'var(--expense)'}}>{successMsg}</p>}
        <button type="submit" disabled={loading} className="w-full mt-6 py-3.5 rounded-full font-bold text-sm text-white transition-all" style={{background:'var(--assets)', opacity: loading ? 0.6 : 1}}>
          {loading ? '處理中...' : (isSignUp ? '註冊帳號' : '登入')}
        </button>
        <div className="text-center mt-5">
          <button type="button" onClick={() => { setIsSignUp(!isSignUp); setError(''); setSuccessMsg(''); }} className="text-[12px] font-bold transition-colors" style={{color:'var(--assets-deep)'}}>
            {isSignUp ? '已經有帳號了？點此登入' : '還沒有帳號？點此註冊'}
          </button>
        </div>
      </form>
    </div>
  );
};

const ReportApp = ({ session }) => {
  const currentUserId = session.user.id;
  const reportRef = useRef(null);
  const reportRef2 = useRef(null);
  const [isDownloading, setIsDownloading] = useState(false);
  const [isDownloading2, setIsDownloading2] = useState(false);

  // 決定目前是「編輯資料頁 (edit)」還是「產生報表頁 (report)」
  const [viewMode, setViewMode] = useState('edit');

  // 狀態管理 - 報表數據
  const [userName, setUserName] = useState('');
  const [advisorName, setAdvisorName] = useState('');
  const [incomes, setIncomes] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [livingExps, setLivingExps] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [savingExps, setSavingExps] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [insuranceExps, setInsuranceExps] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [assets, setAssets] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [loans, setLoans] = useState([{ id: 1, name: '', amount: 0, note: '' }]);
  const [goals, setGoals] = useState('');
  const [futureEvents, setFutureEvents] = useState('');
  const [blindSpots, setBlindSpots] = useState('');
  const [advice, setAdvice] = useState('');
  const [branches, setBranches] = useState([{ id: 'b1', amount: 0, t1: '', t2: '', t3: '', subBranches: [] }]);

  // UI 狀態管理 (標籤)
  const [activeTab, setActiveTab] = useState('basic');

  const tabs = [
    { id: 'basic', label: '👤 客戶基本設定' },
    { id: 'income', label: '💰 現金收入' },
    { id: 'expense', label: '💳 消費支出' },
    { id: 'invest', label: '📈 投資支出' },
    { id: 'insurance', label: '🛡️ 風險保費' },
    { id: 'assets', label: '🏦 資產與負債' },
    { id: 'tree', label: '🌳 樹狀圖邏輯' },
    { id: 'page2', label: '📝 規劃紀錄' }
  ];

  // ---- 樹狀圖連接線 ----
  const treeWrapRef = useRef(null);
  const branchCardRefs = useRef({});
  const subWrapRefs = useRef({});
  const subCardRefs = useRef({});
  const [mainLine, setMainLine] = useState({ width: 0, points: [] });
  const [subLines, setSubLines] = useState({});

  const measureTree = () => {
    if (!treeWrapRef.current) return;
    const treeRect = treeWrapRef.current.getBoundingClientRect();
    const points = branches.map(b => {
      const el = branchCardRefs.current[b.id];
      if (!el) return 0;
      const r = el.getBoundingClientRect();
      return (r.left + r.width / 2) - treeRect.left;
    });

    const subMap = {};
    branches.forEach(b => {
      if (!b.subBranches.length) return;
      const wrapEl = subWrapRefs.current[b.id];
      const cardEl = branchCardRefs.current[b.id];
      if (!wrapEl || !cardEl) return;
      const wrapRect = wrapEl.getBoundingClientRect();
      const cardRect = cardEl.getBoundingClientRect();
      const origin = (cardRect.left + cardRect.width / 2) - wrapRect.left;
      const pts = b.subBranches.map(s => {
        const el = (subCardRefs.current[b.id] || {})[s.id];
        if (!el) return 0;
        const r = el.getBoundingClientRect();
        return (r.left + r.width / 2) - wrapRect.left;
      });
      subMap[b.id] = { width: wrapRect.width, origin, points: pts };
    });

    const almostEqual = (a, b) => Math.abs(a - b) < 0.5;
    setMainLine(prev => {
      if (prev.points.length === points.length && almostEqual(prev.width, treeRect.width) && prev.points.every((v, i) => almostEqual(v, points[i]))) return prev;
      return { width: treeRect.width, points };
    });
    setSubLines(prev => {
      const prevKeys = Object.keys(prev); const newKeys = Object.keys(subMap);
      const same = prevKeys.length === newKeys.length && newKeys.every(k => {
        const a = prev[k], b = subMap[k];
        return a && almostEqual(a.width, b.width) && almostEqual(a.origin, b.origin) && a.points.length === b.points.length && a.points.every((v, i) => almostEqual(v, b.points[i]));
      });
      return same ? prev : subMap;
    });
  };

  const measureTreeRef = useRef(measureTree); measureTreeRef.current = measureTree;
  useLayoutEffect(() => { measureTree(); }, [branches]);

  useEffect(() => {
    let debounceTimer = null; let gestureActive = false;
    const debouncedMeasure = () => { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { if (!gestureActive) measureTreeRef.current(); }, 150); };
    const onTouchStart = (e) => { if (e.touches && e.touches.length > 1) gestureActive = true; };
    const onTouchEnd = () => { if (!gestureActive) return; gestureActive = false; clearTimeout(debounceTimer); debounceTimer = setTimeout(() => measureTreeRef.current(), 200); };
    window.addEventListener('touchstart', onTouchStart, { passive: true }); window.addEventListener('touchend', onTouchEnd, { passive: true }); window.addEventListener('touchcancel', onTouchEnd, { passive: true }); window.addEventListener('resize', debouncedMeasure);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => measureTreeRef.current());
    const t = setTimeout(() => measureTreeRef.current(), 250);
    let ro;
    if (window.ResizeObserver) {
      ro = new ResizeObserver(debouncedMeasure);
      if (treeWrapRef.current) ro.observe(treeWrapRef.current);
      Object.values(branchCardRefs.current).forEach(el => el && ro.observe(el));
      Object.values(subWrapRefs.current).forEach(el => el && ro.observe(el));
    }
    return () => {
      window.removeEventListener('touchstart', onTouchStart); window.removeEventListener('touchend', onTouchEnd); window.removeEventListener('touchcancel', onTouchEnd); window.removeEventListener('resize', debouncedMeasure);
      clearTimeout(t); clearTimeout(debounceTimer); if (ro) ro.disconnect();
    };
  }, [branches]);

  // 資料操作
  const addBranch = () => setBranches([...branches, { id: `b${Date.now()}`, amount: 0, t1: '', t2: '', t3: '', subBranches: [] }]);
  const removeBranch = (id) => setBranches(branches.filter(b => b.id !== id));
  const updateBranch = (id, field, value) => setBranches(branches.map(b => b.id === id ? { ...b, [field]: value } : b));
  const addSubBranch = (bId) => setBranches(branches.map(b => b.id === bId ? { ...b, subBranches: [...b.subBranches, { id: `s${Date.now()}`, amount: 0, t1: '', t2: '', note: '' }] } : b));
  const removeSubBranch = (bId, sId) => setBranches(branches.map(b => b.id === bId ? { ...b, subBranches: b.subBranches.filter(s => s.id !== sId) } : b));
  const updateSubBranch = (bId, sId, field, value) => setBranches(branches.map(b => b.id === bId ? { ...b, subBranches: b.subBranches.map(s => s.id === sId ? { ...s, [field]: value } : s) } : b));

  const handleItemChange = (setter, items, id, field, value) => setter(items.map(item => item.id === id ? { ...item, [field]: value } : item));
  const addItem = (setter, items) => setter([...items, { id: Date.now(), name: '', amount: 0, note: '' }]);
  const removeItem = (setter, items, id) => setter(items.filter(item => item.id !== id));

  const sum = (arr) => arr.reduce((acc, curr) => acc + (Number(curr.amount) || 0), 0);
  const totalIncome = sum(incomes);
  const totalLiving = sum(livingExps);
  const totalSaving = sum(savingExps);
  const totalInsurance = sum(insuranceExps);
  const totalExpense = totalLiving + totalSaving + totalInsurance;
  const totalAssets = sum(assets);
  const totalLoans = sum(loans);
  const netWorth = totalAssets - totalLoans;
  const actualSavingsPool = totalIncome - totalLiving - totalInsurance;

  const distributeTo100 = (values) => {
    const floors = values.map(v => Math.floor(v));
    let remainder = 100 - floors.reduce((a, b) => a + b, 0);
    const order = values.map((v, i) => ({ i, frac: v - floors[i] })).sort((a, b) => b.frac - a.frac);
    const result = [...floors];
    for (let k = 0; k < remainder && k < order.length; k++) result[order[k].i] += 1;
    return result;
  };
  const rawLivingPct = totalIncome ? (totalLiving / totalIncome) * 100 : 0;
  const rawSavingPct = totalIncome ? (actualSavingsPool / totalIncome) * 100 : 0;
  const rawInsurancePct = totalIncome ? (totalInsurance / totalIncome) * 100 : 0;
  const [livingPct, savingPct, insurancePct] = totalIncome ? distributeTo100([rawLivingPct, rawSavingPct, rawInsurancePct]) : [0, 0, 0];

  const [previewImage, setPreviewImage] = useState(null);
  const [clientList, setClientList] = useState([]);
  const [currentReportId, setCurrentReportId] = useState(null);
  const [saveStatus, setSaveStatus] = useState('idle');
  const [showClientPanel, setShowClientPanel] = useState(false);
  const [clientListLoading, setClientListLoading] = useState(false);

  const collectState = () => ({ userName, advisorName, incomes, livingExps, savingExps, insuranceExps, assets, loans, branches, goals, futureEvents, blindSpots, advice });
  const applyState = (d) => {
    if (!d) return;
    setUserName(d.userName || ''); setAdvisorName(d.advisorName || '');
    setIncomes(d.incomes || [{ id: 1, name: '', amount: 0, note: '' }]);
    setLivingExps(d.livingExps || [{ id: 1, name: '', amount: 0, note: '' }]);
    setSavingExps(d.savingExps || [{ id: 1, name: '', amount: 0, note: '' }]);
    setInsuranceExps(d.insuranceExps || [{ id: 1, name: '', amount: 0, note: '' }]);
    setAssets(d.assets || [{ id: 1, name: '', amount: 0, note: '' }]);
    setLoans(d.loans || [{ id: 1, name: '', amount: 0, note: '' }]);
    setBranches(d.branches && d.branches.length ? d.branches : [{ id: 'b1', amount: 0, t1: '', t2: '', t3: '', subBranches: [] }]);
    setGoals(d.goals || ''); setFutureEvents(d.futureEvents || ''); setBlindSpots(d.blindSpots || ''); setAdvice(d.advice || '');
  };

  const refreshClientList = async () => {
    setClientListLoading(true);
    const { data, error } = await supabaseClient.from('reports').select('id, client_name, advisor_name, updated_at').eq('user_id', currentUserId).order('updated_at', { ascending: false });
    if (!error) setClientList(data || []);
    setClientListLoading(false);
  };
  useEffect(() => { refreshClientList(); }, []);

  const saveAsNewClient = async () => {
    setSaveStatus('saving');
    const { data, error } = await supabaseClient.from('reports').insert({ user_id: currentUserId, client_name: userName || '未命名客戶', advisor_name: advisorName, data: collectState() }).select('id').single();
    if (error) { setSaveStatus('error'); alert('儲存失敗：' + error.message); return; }
    setCurrentReportId(data.id); setSaveStatus('saved'); refreshClientList();
  };
  const loadClient = async (id) => {
    const { data, error } = await supabaseClient.from('reports').select('*').eq('id', id).single();
    if (error) { alert('讀取失敗：' + error.message); return; }
    applyState(data.data); setCurrentReportId(data.id); setShowClientPanel(false);
  };
  const deleteClient = async (id) => {
    if (!confirm('確定要刪除這位客戶的報表嗎？此動作無法復原。')) return;
    const { error } = await supabaseClient.from('reports').delete().eq('id', id);
    if (error) { alert('刪除失敗：' + error.message); return; }
    if (currentReportId === id) setCurrentReportId(null);
    refreshClientList();
  };
  const startNewBlank = () => {
    if (!confirm('要開始填寫新客戶嗎？目前畫面上的內容如果還沒存檔會遺失。')) return;
    applyState(null); setCurrentReportId(null);
  };

  const autoSaveTimer = useRef(null);
  useEffect(() => {
    if (!currentReportId) return;
    setSaveStatus('saving'); clearTimeout(autoSaveTimer.current);
    autoSaveTimer.current = setTimeout(async () => {
      const { error } = await supabaseClient.from('reports').update({ client_name: userName || '未命名客戶', advisor_name: advisorName, data: collectState(), updated_at: new Date().toISOString() }).eq('id', currentReportId);
      setSaveStatus(error ? 'error' : 'saved');
      if (!error) refreshClientList();
    }, 1000);
    return () => clearTimeout(autoSaveTimer.current);
  }, [userName, advisorName, incomes, livingExps, savingExps, insuranceExps, assets, loans, branches, goals, futureEvents, blindSpots, advice, currentReportId]);

  const downloadRef = async (ref, setBusy, filename) => {
    if (!ref.current) return;
    setBusy(true);
    try {
      await new Promise(resolve => setTimeout(resolve, 100));
      const scale = window.innerWidth < 1024 ? 1.5 : 2;
      const canvas = await html2canvas(ref.current, { scale: scale, useCORS: true, backgroundColor: '#ffffff' });
      const fallbackDownload = (blob) => {
        const url = window.URL.createObjectURL(blob); const link = document.createElement("a"); link.style.display = "none"; link.href = url; link.download = filename;
        document.body.appendChild(link); link.click(); document.body.removeChild(link); setTimeout(() => window.URL.revokeObjectURL(url), 100);
      };
      canvas.toBlob(async (blob) => {
        if (!blob) { alert("圖片生成失敗！"); setBusy(false); return; }
        const file = new File([blob], filename, { type: blob.type });
        let shareSucceeded = false;
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try { await navigator.share({ files: [file], title: filename }); shareSucceeded = true; } catch (err) { if (err.name === 'AbortError') shareSucceeded = true; }
        }
        if (!shareSucceeded) {
          try { fallbackDownload(blob); } catch (e) { }
          const reader = new FileReader();
          reader.onload = () => setPreviewImage({ dataUrl: reader.result, filename });
          reader.readAsDataURL(blob);
        }
        setBusy(false);
      }, "image/png", 1.0);
    } catch (error) { console.error("輸出圖片失敗:", error); alert("輸出圖片失敗，請再試一次。"); setBusy(false); }
  };

  const handleDownloadImage = () => downloadRef(reportRef, setIsDownloading, `財務分配報表_${userName}.png`);
  const handleDownloadImage2 = () => downloadRef(reportRef2, setIsDownloading2, `財務規劃紀錄_${userName}.png`);
  const [showExportMenu, setShowExportMenu] = useState(false);
  const isDownloadingAny = isDownloading || isDownloading2;
  const handleDownloadBoth = async () => { await handleDownloadImage(); await new Promise(r => setTimeout(r, 500)); await handleDownloadImage2(); };

  const RenderList = ({ items, isSaving = false }) => (
    <div className="flex flex-col gap-1.5 mt-3">{items.filter(item => Number(item.amount) > 0).map(item => (<div key={item.id} className="group flex items-center justify-between py-2.5 px-1 rounded-lg transition-colors" onMouseEnter={e=>e.currentTarget.style.background='var(--paper)'} onMouseLeave={e=>e.currentTarget.style.background='transparent'}><div className="flex items-center gap-2.5"><span className="font-bold text-[14.5px]" style={{color:'var(--ink)'}}>{item.name || '-'}</span>{item.note && (<span className="text-[11px] px-2.5 py-0.5 rounded-full font-bold" style={{background: isSaving ? 'var(--income-bg)' : 'var(--income-deep)' , color: isSaving ? 'var(--income-deep)' : 'var(--expense-deep)'}}>{item.note}</span>)}</div><span className="font-num font-extrabold text-[15.5px]" style={{color:'var(--ink)'}}>{Number(item.amount).toLocaleString()}</span></div>))}</div>
  );

  const InputGroup = ({ label, value, onChange, placeholder, type = "text" }) => (
    <div className="flex flex-col gap-1"><label className="text-[10.5px] font-bold tracking-wider pl-1 uppercase" style={{color:'#a8a49a'}}>{label}</label>{type === "number" ? (<MoneyInput value={value} onChange={v => onChange({ target: { value: v } })} placeholder={placeholder} className="rounded-lg p-2.5 text-sm outline-none transition-colors" style={{background:'#f5f4ef', border:'1.5px solid #e7e5dd', color:'var(--ink)'}}/>) : (<input type={type} value={value} onChange={onChange} className="rounded-lg p-2.5 text-sm outline-none transition-colors" style={{background:'#f5f4ef', border:'1.5px solid #e7e5dd', color:'var(--ink)'}} onFocus={e => e.target.style.borderColor = '#5271e0'} onBlur={e => e.target.style.borderColor = '#e7e5dd'} placeholder={placeholder}/>)}</div>
  );

  // 用於全螢幕編輯模式的分類渲染
  const renderEditSection = (title, name, data, setter, tone, showNote) => (
    <div className="animate-[fadeIn_0.2s_ease-out]">
      <div className="flex justify-between items-center mb-5 pb-4" style={{borderBottom:'1px solid var(--line)'}}>
        <h2 className="font-display font-extrabold text-xl flex items-center gap-2 text-[#22252b]">{title} <span className="text-[13px] font-bold text-gray-400 ml-1">{name}</span></h2>
        <button onClick={() => addItem(setter, data)} className="text-[13px] font-bold tracking-wider px-4 py-2 rounded-full shadow-sm hover:-translate-y-0.5 transition-transform" style={{color:`var(--${tone}-deep)`, background:`var(--${tone}-bg)`}}>+ 新增項目</button>
      </div>
      <div className="space-y-4">
        {data.map(item => (
          <div key={item.id} className="flex flex-wrap md:flex-nowrap gap-3 relative group p-3 rounded-2xl items-center transition-colors" style={{background:'#f9f8f4', border:'1px solid #eeece4'}}>
            <input type="text" value={item.name} onChange={e => handleItemChange(setter, data, item.id, 'name', e.target.value)} className={`${showNote ? 'w-full md:w-[40%]' : 'w-full md:w-1/2'} bg-transparent border-none p-2 text-[15px] outline-none font-bold`} style={{color:'var(--ink)'}} placeholder="項目名稱"/>
            <MoneyInput value={item.amount} onChange={v => handleItemChange(setter, data, item.id, 'amount', v)} className={`${showNote ? 'w-full md:w-2/5' : 'w-full md:w-1/2'} bg-transparent p-2 text-[15px] outline-none font-num font-bold border-t md:border-t-0 md:border-l border-[#e7e5dd]`} style={{color:'var(--ink)'}} placeholder="金額"/>
            {showNote && (<input type="text" value={item.note} onChange={e => handleItemChange(setter, data, item.id, 'note', e.target.value)} className="w-full md:w-1/5 bg-transparent p-2 text-[14px] outline-none font-bold border-t md:border-t-0 md:border-l border-[#e7e5dd]" style={{color:'#a8a49a'}} placeholder="備註"/>)}
            <button onClick={() => removeItem(setter, data, item.id)} className="absolute -right-2 -top-2 md:-right-3 md:-top-3 w-7 h-7 rounded-full flex items-center justify-center text-[12px] opacity-100 md:opacity-0 group-hover:opacity-100 transition-all text-white shadow-md hover:scale-110" style={{background:'var(--danger)'}}>✕</button>
          </div>
        ))}
        {data.length === 0 && (
          <div className="text-center py-10 text-sm font-bold text-gray-400 border-2 border-dashed rounded-2xl border-gray-200">尚無項目，請點擊右上方新增</div>
        )}
      </div>
    </div>
  );

  return (
    <div className="min-h-screen flex flex-col xl:h-screen" style={{background:'var(--paper)'}}>
      
      {/* =========================================================================
          Header (確保 z-50 relative，下拉選單絕對不被蓋住)
          ========================================================================= */}
      <div className="px-6 py-4 flex justify-between items-center print:hidden z-50 relative shrink-0" style={{background:'var(--card)', borderBottom:'1px solid var(--line)'}}>
        <div className="flex items-center gap-3.5">
          <a href="index.html" className="flex items-center justify-center w-10 h-10 rounded-full transition-colors hover:-translate-y-0.5" style={{background:'#f5f4ef', color:'var(--ink-soft)', border:'1.5px solid #e7e5dd'}} title="返回系統首頁">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
          </a>
          <div className="w-10 h-10 rounded-2xl flex items-center justify-center" style={{background:'linear-gradient(135deg, var(--income), var(--assets))'}}><IconChart color="#ffffff" /></div>
          <div><h1 className="font-display text-lg font-extrabold tracking-tight" style={{color:'var(--ink)'}}>全方位財務分配報表</h1><p className="text-[11px] font-num font-bold tracking-[0.2em] uppercase" style={{color:'#b7b3a8'}}>Architecture of Wealth</p></div>
        </div>
        
        <div className="flex items-center gap-3">
          <div className="text-right hidden md:block">
            <div className="text-[12px] font-bold" style={{color:'var(--ink-soft)'}}>{session.user.email}</div>
            <div className="text-[11px] font-num" style={{color: saveStatus==='saving' ? '#b7b3a8' : saveStatus==='error' ? 'var(--loan)' : 'var(--expense)'}}>
              {!currentReportId ? '尚未儲存為客戶' : saveStatus==='saving' ? '儲存中...' : saveStatus==='error' ? '儲存失敗' : '✓ 已自動儲存'}
            </div>
          </div>

          <div className="relative">
            <button onClick={() => { setShowClientPanel(v => !v); refreshClientList(); }} className="px-5 py-3 rounded-full font-bold text-sm transition-colors hover:bg-yellow-100" style={{background:'var(--income-bg)', color:'var(--income-deep)'}}>
              👥 客戶清單
            </button>
            {showClientPanel && (
              <>
                <div className="fixed inset-0 z-30" onClick={() => setShowClientPanel(false)}></div>
                <div className="absolute right-0 mt-2 w-72 rounded-2xl overflow-hidden z-40" style={{background:'var(--card)', boxShadow:'0 12px 32px rgba(34,37,43,0.16)', border:'1px solid var(--line)'}}>
                  <button onClick={() => { setShowClientPanel(false); saveAsNewClient(); }} className="w-full text-left px-5 py-3.5 text-sm font-bold transition-colors hover:bg-black/[0.03]" style={{color:'var(--assets-deep)', background:'var(--assets-bg)'}}>＋ 儲存目前畫面為新客戶</button>
                  <button onClick={() => { setShowClientPanel(false); startNewBlank(); }} className="w-full text-left px-5 py-3.5 text-sm font-bold transition-colors hover:bg-black/[0.03]" style={{color:'var(--ink)', borderTop:'1px solid var(--line)'}}>＋ 開始填寫新的空白客戶</button>
                  <div className="max-h-72 overflow-y-auto" style={{borderTop:'1px solid var(--line)'}}>
                    {clientListLoading && <div className="px-5 py-4 text-sm" style={{color:'#a8a49a'}}>載入中...</div>}
                    {!clientListLoading && clientList.length === 0 && <div className="px-5 py-4 text-sm" style={{color:'#a8a49a'}}>還沒有存過任何客戶</div>}
                    {clientList.map(c => (
                      <div key={c.id} className="flex items-center justify-between px-5 py-3 group" style={{background: c.id===currentReportId ? 'var(--income-bg)' : 'transparent', borderTop:'1px solid var(--line)'}}>
                        <button onClick={() => loadClient(c.id)} className="flex-1 text-left">
                          <div className="text-sm font-bold" style={{color:'var(--ink)'}}>{c.client_name || '未命名客戶'}</div>
                          <div className="text-[11px]" style={{color:'#a8a49a'}}>{new Date(c.updated_at).toLocaleString('zh-TW')}</div>
                        </button>
                        <button onClick={() => deleteClient(c.id)} className="text-[11px] font-bold px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition-opacity" style={{color:'var(--loan)'}}>刪除</button>
                      </div>
                    ))}
                  </div>
                </div>
              </>
            )}
          </div>

          <button onClick={() => supabaseClient.auth.signOut()} className="px-4 py-3 rounded-full font-bold text-sm hidden sm:block" style={{background:'#f5f4ef', color:'var(--ink-soft)'}}>登出</button>

          {/* ===== 雙頁面切換按鈕 ===== */}
          {viewMode === 'edit' ? (
            <button onClick={() => setViewMode('report')} className="px-6 py-3 rounded-full font-bold transition-all text-sm tracking-wide flex items-center gap-2 text-white shadow-[0_4px_14px_rgba(82,113,224,0.35)] hover:shadow-[0_6px_20px_rgba(82,113,224,0.45)] hover:-translate-y-0.5" style={{background:'var(--assets)'}}>
              👉 產生報表
            </button>
          ) : (
            <div className="flex items-center gap-2">
              <button onClick={() => setViewMode('edit')} className="px-6 py-3 rounded-full font-bold transition-all text-sm tracking-wide flex items-center gap-2 hover:-translate-y-0.5" style={{background:'#f5f4ef', color:'var(--ink)'}}>
                ◀ 返回編輯
              </button>

              <div className="relative">
                <button onClick={() => setShowExportMenu(v => !v)} disabled={isDownloadingAny} className={`px-6 py-3 rounded-full font-bold transition-all text-sm tracking-wide flex items-center gap-2 text-white shadow-[0_4px_14px_rgba(82,113,224,0.35)] ${isDownloadingAny ? 'opacity-50 cursor-not-allowed' : 'hover:shadow-[0_6px_20px_rgba(82,113,224,0.45)] hover:-translate-y-0.5'}`} style={{background:'var(--assets)'}}>
                  {isDownloadingAny ? '⏳ 處理中...' : '⬇ 輸出報表'}
                </button>
                {showExportMenu && !isDownloadingAny && (
                  <>
                    <div className="fixed inset-0 z-30" onClick={() => setShowExportMenu(false)}></div>
                    <div className="absolute right-0 mt-2 w-56 rounded-2xl overflow-hidden z-40" style={{background:'var(--card)', boxShadow:'0 12px 32px rgba(34,37,43,0.16)', border:'1px solid var(--line)'}}>
                      <button onClick={() => { setShowExportMenu(false); handleDownloadImage(); }} className="w-full text-left px-5 py-3.5 text-sm font-bold transition-colors hover:bg-black/[0.03]" style={{color:'var(--ink)'}}>只輸出第一頁<div className="text-[11px] font-medium mt-0.5" style={{color:'#a8a49a'}}>財務分配報表</div></button>
                      <button onClick={() => { setShowExportMenu(false); handleDownloadImage2(); }} className="w-full text-left px-5 py-3.5 text-sm font-bold transition-colors hover:bg-black/[0.03]" style={{color:'var(--ink)', borderTop:'1px solid var(--line)'}}>只輸出第二頁<div className="text-[11px] font-medium mt-0.5" style={{color:'#a8a49a'}}>財務規劃紀錄</div></button>
                      <button onClick={() => { setShowExportMenu(false); handleDownloadBoth(); }} className="w-full text-left px-5 py-3.5 text-sm font-bold transition-colors hover:bg-black/[0.03]" style={{color:'var(--assets-deep)', background:'var(--assets-bg)', borderTop:'1px solid var(--line)'}}>兩頁都輸出<div className="text-[11px] font-medium mt-0.5" style={{color:'var(--assets)'}}>下載兩張 PNG 圖片</div></button>
                    </div>
                  </>
                )}
              </div>
            </div>
          )}

        </div>
      </div>

      {/* =========================================================================
          主內容區域 (根據 viewMode 切換編輯/預覽模式)
          ========================================================================= */}
      <div className="flex-1 flex flex-col relative overflow-hidden">
        
        {viewMode === 'edit' ? (
          /* ================== 第一頁：全螢幕編輯模式 ================== */
          <div className="flex-1 flex flex-col items-center bg-[#f1efe8] overflow-y-auto custom-scrollbar pt-6">
            
            {/* 標籤列 (自動換行 flex-wrap，確保手機/平板一次全部顯示) */}
            <div className="w-full max-w-4xl px-4">
              <div className="w-full pb-4">
                <div className="flex flex-wrap justify-center gap-2 md:gap-3">
                  {tabs.map(t => (
                    <button key={t.id} onClick={() => setActiveTab(t.id)} className={`px-4 py-2.5 md:px-5 md:py-3 rounded-full text-[13px] md:text-[14px] font-bold transition-all ${activeTab === t.id ? 'shadow-md text-white' : 'hover:bg-white text-gray-500 bg-white/50'}`} style={{background: activeTab === t.id ? 'var(--ink)' : ''}}>
                      {t.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {/* 輸入卡片區塊 */}
            <div className="w-full max-w-4xl px-4 pb-24 mt-2">
              <div className="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-gray-100" style={{boxShadow:'0 12px 32px rgba(34,37,43,0.06)'}}>
                
                {activeTab === 'basic' && (
                  <div className="animate-[fadeIn_0.2s_ease-out]">
                    <div className="flex items-center gap-3 mb-4 pb-5 border-b border-[#edece6]">
                      <div className="w-12 h-12 rounded-full flex items-center justify-center bg-[#eef1fd] text-[22px]">👤</div>
                      <h2 className="font-display font-extrabold text-2xl text-[#22252b]">客戶基本設定</h2>
                    </div>
                    <div className="space-y-7 mt-8">
                      <div>
                        <label className="block text-[14px] font-bold text-[#7a7f8a] mb-2 tracking-wide">報表擁有者姓名</label>
                        <input type="text" value={userName} onChange={(e) => setUserName(e.target.value)} className="w-full rounded-2xl p-4 font-bold outline-none text-[17px] transition-all focus:border-[#5271e0] focus:bg-white" style={{background:'#f5f4ef', border:'2px solid #e7e5dd', color:'var(--ink)'}} placeholder="請輸入客戶姓名" />
                      </div>
                      <div>
                        <label className="block text-[14px] font-bold text-[#7a7f8a] mb-2 tracking-wide">專屬財務顧問</label>
                        <input type="text" value={advisorName} onChange={(e) => setAdvisorName(e.target.value)} className="w-full rounded-2xl p-4 font-bold outline-none text-[17px] transition-all focus:border-[#5271e0] focus:bg-white" style={{background:'#f5f4ef', border:'2px solid #e7e5dd', color:'var(--ink)'}} placeholder="請輸入顧問姓名" />
                      </div>
                    </div>
                  </div>
                )}

                {activeTab === 'income' && renderEditSection("💰 現金收入", "Income", incomes, setIncomes, "income", false)}
                {activeTab === 'expense' && renderEditSection("💳 消費支出", "Expense", livingExps, setLivingExps, "expense", false)}
                {activeTab === 'invest' && renderEditSection("📈 投資支出", "Investment", savingExps, setSavingExps, "expense", true)}
                {activeTab === 'insurance' && renderEditSection("🛡️ 風險保費", "Insurance", insuranceExps, setInsuranceExps, "expense", false)}
                
                {activeTab === 'assets' && (
                  <div className="space-y-12 animate-[fadeIn_0.2s_ease-out]">
                    {renderEditSection("🏦 資產", "Assets", assets, setAssets, "assets", false)}
                    {renderEditSection("📉 負債", "Loans", loans, setLoans, "loan", false)}
                  </div>
                )}

                {activeTab === 'tree' && (
                  <div className="animate-[fadeIn_0.2s_ease-out]">
                    <div className="flex justify-between items-center mb-6 pb-4 border-b border-[#edece6]">
                      <h2 className="font-display font-extrabold text-xl flex items-center gap-2 text-[#22252b]">🌳 樹狀圖邏輯 <span className="text-[13px] font-bold text-gray-400 ml-1">Tree Logic</span></h2>
                      <button onClick={addBranch} className="text-[13px] font-bold tracking-wider px-4 py-2 rounded-full shadow-sm hover:-translate-y-0.5 transition-transform" style={{color:'var(--expense-deep)', background:'var(--expense-bg)'}}>+ 新增主分支</button>
                    </div>
                    {branches.map((b, i) => (
                      <div key={b.id} className="mb-8 p-6 rounded-3xl relative" style={{background:'#f9f8f4', border:'1px solid #eeece4'}}>
                        <div className="flex justify-between items-center mb-5">
                          <div className="font-black text-[15px] px-4 py-2 rounded-xl text-white shadow-sm" style={{background:'var(--assets)'}}>主分支 {i + 1}</div>
                          <div className="flex gap-3">
                            <button onClick={() => addSubBranch(b.id)} className="text-[13px] font-bold px-4 py-2 rounded-full transition-transform hover:-translate-y-0.5" style={{color:'var(--assets-deep)', background:'var(--assets-bg)'}}>+ 新增子層</button>
                            <button onClick={() => removeBranch(b.id)} className="text-[13px] font-bold px-4 py-2 rounded-full transition-colors hover:bg-red-100" style={{color:'#b5443a', background:'var(--danger-bg)'}}>刪除分支</button>
                          </div>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                          <InputGroup label="分支金額" value={b.amount} onChange={e => updateBranch(b.id, 'amount', e.target.value)} type="number" placeholder="例: 10000" />

                          <InputGroup label="備註 (小)" value={b.t3} onChange={e => updateBranch(b.id, 't3', e.target.value)} placeholder="例: 國泰銀行" />
                        </div>
                        {b.subBranches.length > 0 && (
                          <div className="pl-4 md:pl-6 space-y-4 mt-6" style={{borderLeft:'3px solid #e7e5dd'}}>
                            {b.subBranches.map((sub, j) => (
                              <div key={sub.id} className="p-4 md:p-5 rounded-2xl relative group shadow-sm border border-[#eeece4]" style={{background:'#ffffff'}}>
                                <button onClick={() => removeSubBranch(b.id, sub.id)} className="absolute top-3 right-3 w-8 h-8 rounded-full flex items-center justify-center bg-gray-100 text-gray-400 hover:bg-red-100 hover:text-red-500 transition-colors">✕</button>
                                <div className="text-[14px] font-extrabold mb-4" style={{color:'#c7c4ba'}}>↳ 子分支 {j + 1}</div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                  <InputGroup label="金額" value={sub.amount} onChange={e => updateSubBranch(b.id, sub.id, 'amount', e.target.value)} type="number" placeholder="數字" />
                                  <InputGroup label="用途" value={sub.t1} onChange={e => updateSubBranch(b.id, sub.id, 't1', e.target.value)} placeholder="名稱" />
                                  <InputGroup label="備注" value={sub.t2} onChange={e => updateSubBranch(b.id, sub.id, 't2', e.target.value)} placeholder="附註" />
                                  <InputGroup label="懸浮說明" value={sub.note} onChange={e => updateSubBranch(b.id, sub.id, 'note', e.target.value)} placeholder="詳細說明" />
                                </div>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    ))}
                  </div>
                )}

                {activeTab === 'page2' && (
                  <div className="animate-[fadeIn_0.2s_ease-out]">
                    <div className="flex items-center gap-3 mb-4 pb-5 border-b border-[#edece6]">
                      <div className="w-12 h-12 rounded-full flex items-center justify-center bg-[#fdf4e0] text-[22px]">📝</div>
                      <h2 className="font-display font-extrabold text-2xl text-[#22252b]">財務規劃紀錄</h2>
                    </div>
                    <div className="space-y-6 mt-8">
                      {[{ label: '🎯 想完成的事', value: goals, setter: setGoals, ph: '例：3年內買房自住、45歲前存到退休金1000萬...' },{ label: '⚠️ 未來可能會遇到的事', value: futureEvents, setter: setFutureEvents, ph: '例：父母年邁的長照需求、換工作的收入空窗期...' },{ label: '🔍 理財盲點', value: blindSpots, setter: setBlindSpots, ph: '例：緊急預備金不足、保障集中在單一險種...' },{ label: '💡 理財建議', value: advice, setter: setAdvice, ph: '例：建議增加醫療險保額、設立3-6個月緊急預備金...' }].map((f, i) => (
                        <div key={i}>
                          <label className="block text-[14px] font-bold text-[#7a7f8a] mb-2 tracking-wide">{f.label}</label>
                          <textarea value={f.value} onChange={e => f.setter(e.target.value)} rows={4} className="w-full rounded-2xl p-4 text-[15px] font-medium outline-none transition-all resize-y focus:border-[#5271e0] focus:bg-white" style={{background:'#f5f4ef', border:'2px solid #e7e5dd', color:'var(--ink)'}} placeholder={f.ph}/>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

              </div>
            </div>
          </div>
        ) : (
          /* ================== 第二頁：產出報表預覽模式 ================== */
          <div className="flex-1 overflow-x-auto xl:overflow-y-auto p-4 md:p-8 xl:p-12 flex flex-col items-center gap-10 print:p-0 print:gap-0 custom-scrollbar z-10 relative bg-[#f1efe8]">
            
            {/* 第一頁：財務分配報表 */}
            <div ref={reportRef} className="p-14 xl:p-20 rounded-[2.5rem] w-[1440px] min-w-[1200px] print:w-full print:min-w-0 print:shadow-none print:p-0 relative flex flex-col" style={{background:'var(--card)', boxShadow:'0 28px 64px rgba(34,37,43,0.18), 0 6px 16px rgba(34,37,43,0.10)'}}>
              <div className="absolute top-0 right-0 w-[620px] h-[620px] rounded-full glow-blob pointer-events-none" style={{background:'radial-gradient(circle, var(--income-bg) 0%, rgba(255,255,255,0) 68%)', transform:'translate(30%,-45%)'}}></div>
              <div className="absolute bottom-0 left-0 w-[520px] h-[520px] rounded-full glow-blob pointer-events-none" style={{background:'radial-gradient(circle, var(--assets-bg) 0%, rgba(255,255,255,0) 68%)', transform:'translate(-25%,30%)'}}></div>
              <div className="absolute left-[26%] top-16 bottom-16 w-px" style={{background:'var(--line)'}}></div>
              <div className="absolute left-[58%] top-16 bottom-16 w-px" style={{background:'var(--line)'}}></div>
              
              <div className="grid grid-cols-12 gap-16 xl:gap-20 relative z-10 flex-1">
                <div className="col-span-3 flex flex-col gap-10">
                  <div className="flex flex-col"><div className="mb-5"><CategoryChip icon={<IconCoin color="#9c6c14"/>} label="Income" zh="現金收入" tone="income" /></div><ValueBox value={totalIncome} /><div className="mt-3"><RenderList items={incomes} /></div></div>
                  <div className="flex flex-col flex-1 mt-4"><div className="mb-5"><CategoryChip icon={<IconWallet color="#1f7566"/>} label="Expense" zh="支出" tone="expense" /></div><ValueBox value={totalExpense} />
                  <div className="mt-4"><SectionTitle amount={totalLiving} icon={<IconHome color="#7a7f8a"/>}>消費支出</SectionTitle><RenderList items={livingExps} />
                  <SectionTitle amount={totalSaving} icon={<IconPiggy color="#7a7f8a"/>}>投資支出</SectionTitle><RenderList items={savingExps} isSaving={true} />
                  <SectionTitle amount={totalInsurance} icon={<IconShield color="#7a7f8a"/>}>風險保費支出</SectionTitle><RenderList items={insuranceExps} /></div></div>
                </div>
                
                <div className="col-span-4 flex flex-col pt-2">
                  <div className="flex justify-center mb-12"><h2 className="font-display text-xl font-extrabold tracking-tight" style={{color:'var(--ink)'}}>人生黃金財務分配法則</h2></div>
                  <div className="p-10 rounded-[2rem] flex flex-col items-center flex-1 justify-center relative" style={{background:'var(--paper)'}}>
                    <div className="text-[13px] font-bold tracking-widest mb-10 px-6 py-2.5 rounded-full z-10" style={{color:'var(--income-deep)', background:'var(--card)', boxShadow:'0 2px 10px rgba(220,154,38,0.15)'}}>生活支出 50-60%</div>
                    <div className="relative w-64 aspect-[200/173] z-0"><svg viewBox="0 0 200 173" className="w-full h-full"><defs><linearGradient id="goldGrad" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stopColor="#f6d888" /><stop offset="100%" stopColor="#dc9a26" /></linearGradient></defs><path d="M 100 14 L 186 158 L 14 158 Z" fill="url(#goldGrad)" rx="20"/></svg><div className="absolute inset-0 flex items-center justify-center pt-8"><span className="font-display text-[19px] font-extrabold tracking-[0.25em] text-white">月收入</span></div></div>
                    <div className="w-full flex justify-between px-4 mt-10 z-10"><div className="text-center w-[45%]"><div className="text-[15px] font-bold" style={{color:'var(--ink)'}}>儲蓄理財</div><div className="text-[13px] mt-1.5 font-num font-bold" style={{color:'var(--ink-soft)'}}>30-40%</div></div><div className="text-center w-[45%]"><div className="text-[15px] font-bold" style={{color:'var(--ink)'}}>風險保障</div><div className="text-[13px] mt-1.5 font-num font-bold" style={{color:'var(--ink-soft)'}}>10-20%</div></div></div>
                  </div>
                  <div className="mt-10 pt-8" style={{borderTop:'1.5px solid var(--line)'}}><div className="flex justify-between items-end mb-6"><span className="font-display font-extrabold tracking-tight text-lg flex items-center gap-2" style={{color:'var(--ink)'}}><IconChart color="#5271e0" /> 資產總覽 ASSETS</span><span className="font-num font-extrabold text-2xl" style={{color:'var(--assets)'}}>${totalAssets.toLocaleString()}</span></div><div className="space-y-1">{assets.filter(item => Number(item.amount) > 0).map(item => (<div key={item.id} className="flex justify-between items-center py-2.5 px-1 rounded-lg text-base" style={{borderBottom:'1px solid var(--line)'}}><span className="font-medium" style={{color:'var(--ink-soft)'}}>{item.name}</span><span className="font-num font-bold" style={{color:'var(--ink)'}}>{`$ ${Number(item.amount).toLocaleString()}`}</span></div>))}</div></div>
                  <div className="mt-8 pt-8" style={{borderTop:'1.5px solid var(--line)'}}><div className="flex justify-between items-end mb-6"><span className="font-display font-extrabold tracking-tight text-lg flex items-center gap-2" style={{color:'var(--ink)'}}><IconWallet color="#c15c50" /> 貸款總覽 LIABILITIES</span><span className="font-num font-extrabold text-2xl" style={{color:'var(--loan)'}}>${totalLoans.toLocaleString()}</span></div><div className="space-y-1">{loans.filter(item => Number(item.amount) > 0).map(item => (<div key={item.id} className="flex justify-between items-center py-2.5 px-1 rounded-lg text-base" style={{borderBottom:'1px solid var(--line)'}}><span className="font-medium" style={{color:'var(--ink-soft)'}}>{item.name}</span><span className="font-num font-bold" style={{color:'var(--ink)'}}>{`$ ${Number(item.amount).toLocaleString()}`}</span></div>))}</div><div className="flex justify-between items-center mt-4 pt-4 px-1" style={{borderTop:'1.5px dashed var(--line)'}}><span className="font-bold text-[14px]" style={{color:'var(--ink)'}}>淨資產 NET WORTH</span><span className="font-num font-extrabold text-xl" style={{color: netWorth >= 0 ? 'var(--assets)' : 'var(--loan)'}}>${netWorth.toLocaleString()}</span></div></div>
                </div>
                
                <div className="col-span-5 flex flex-col items-center pt-2">
                  <div className="flex justify-center mb-12"><h2 className="font-display text-xl font-extrabold tracking-tight" style={{color:'var(--ink)'}}>實際 <span style={{color:'var(--assets)'}} className="mx-1">{userName}</span> 財務分配</h2></div>
                  <div className="w-full flex flex-col items-center">
                    <div className="flex flex-col items-center mb-8 z-10"><span className="font-num font-extrabold text-[32px] tracking-tight" style={{color:'var(--ink)'}}>${totalLiving.toLocaleString()}</span><span className="text-[12px] font-bold tracking-widest mt-1.5 px-4 py-1 rounded-full font-num" style={{background:'var(--assets-bg)', color:'var(--assets-deep)'}}>{livingPct}%</span></div>
                    <div className="relative w-72 aspect-[200/173] z-0"><svg viewBox="0 0 200 173" className="w-full h-full"><defs><linearGradient id="blueGrad" x1="50%" y1="0%" x2="50%" y2="100%"><stop offset="0%" stopColor="#9db1ef" /><stop offset="100%" stopColor="#5271e0" /></linearGradient></defs><path d="M 100 14 L 190 158 L 10 158 Z" fill="url(#blueGrad)"/></svg><div className="absolute inset-0 flex flex-col items-center justify-center pt-12"><span className="font-num text-[27px] font-extrabold text-white tracking-tight">${totalIncome.toLocaleString()}</span><span className="w-10 h-[3px] bg-white mt-1.5 opacity-50 rounded-full"></span></div></div>
                    <div className="w-full flex justify-between px-6 mt-8 z-10 relative"><div className="flex flex-col items-center relative w-[46%]"><span className="font-num font-extrabold text-2xl tracking-tight" style={{color:'var(--ink)'}}>${actualSavingsPool.toLocaleString()}</span><span className="text-[12px] font-bold tracking-widest mt-1.5 px-4 py-1 rounded-full font-num" style={{background:'var(--income-bg)', color:'var(--income-deep)'}}>{savingPct}%</span></div>
                    <div className="flex flex-col items-center w-[46%]"><span className="font-num font-extrabold text-2xl tracking-tight" style={{color:'var(--ink)'}}>${totalInsurance.toLocaleString()}</span><span className="text-[12px] font-bold tracking-widest mt-1.5 px-4 py-1 rounded-full font-num" style={{background:'var(--expense-bg)', color:'var(--expense-deep)'}}>{insurancePct}%</span>{insuranceExps[0] && Number(insuranceExps[0].amount) > 0 && (<div className="font-medium text-[12px] mt-3 pt-1.5" style={{color:'var(--ink-soft)', borderTop:'1px solid var(--line)'}}>{insuranceExps[0].name}</div>)}</div></div>
                  </div>
                  
                  {/* 樹狀圖 */}
                  <div className="w-full mt-6 relative" ref={treeWrapRef}>
                    {branches.length > 0 && (<div className="w-full h-16 relative overflow-visible"><svg width={mainLine.width || '100%'} height="64" style={{position:'absolute', inset:0, overflow:'visible'}}><circle cx={mainLine.width * 0.25} cy="0" r="4" fill="var(--assets)" />{branches.map((b, i) => {const tx = mainLine.points[i] || 0; return (<React.Fragment key={`line-${b.id}`}><line x1={mainLine.width * 0.25} y1="0" x2={tx} y2="64" stroke="#e7e5dd" strokeWidth="2.5" strokeLinecap="round" /><circle cx={tx} cy="64" r="4" fill="#d8d5cc" /></React.Fragment>);})}</svg></div>)}
                    <div className="flex w-full gap-5 mt-2 items-start">{branches.map((branch, idx) => (
                      <div key={branch.id} className="flex flex-col items-center z-10" style={{ flexGrow: 1 + branch.subBranches.length * 0.55, flexBasis: 0, minWidth: 0 }}>
                        <div ref={el => branchCardRefs.current[branch.id] = el} className="w-full py-4 px-2 text-center rounded-2xl hover:-translate-y-1 transition-transform" style={{background:'var(--assets-bg)', boxShadow:'0 12px 26px rgba(34,37,43,0.16), 0 3px 8px rgba(34,37,43,0.09)', borderTop:'3px solid var(--assets)'}}><div className="font-num text-[20px] font-extrabold tracking-tight" style={{color:'var(--ink)'}}>{Number(branch.amount).toLocaleString()}</div>{branch.t1 && <div className="font-bold text-[14px] mt-2" style={{color:'var(--expense-deep)'}}>{branch.t1}</div>}{branch.t2 && <div className="text-[12px] font-medium mt-1" style={{color:'var(--ink-soft)'}}>{branch.t2}</div>}{branch.t3 && !branch.subBranches.length && (<div className="font-bold text-[12px] mt-2 pt-1.5" style={{color:'var(--ink-soft)', borderTop:'1px solid var(--line)'}}>{branch.t3}</div>)}</div>
                        {branch.subBranches.length > 0 && (<div ref={el => subWrapRefs.current[branch.id] = el} className="relative flex flex-col items-center w-full mt-1"><div className="w-full h-11 relative"><svg width={(subLines[branch.id] && subLines[branch.id].width) || '100%'} height="44" style={{position:'absolute', inset:0, overflow:'visible'}}><circle cx={(subLines[branch.id] && subLines[branch.id].origin) || 0} cy="0" r="3" fill="#d8d5cc" />{branch.subBranches.map((sub, j) => {const sx = (subLines[branch.id] && subLines[branch.id].points[j]) || 0; const originX = (subLines[branch.id] && subLines[branch.id].origin) || 0; return (<React.Fragment key={`subline-${sub.id}`}><line x1={originX} y1="0" x2={sx} y2="44" stroke="#eeece4" strokeWidth="2" strokeLinecap="round" /><circle cx={sx} cy="44" r="2.5" fill="#d8d5cc" /></React.Fragment>);})}</svg></div>
                        <div className="flex w-full gap-2 mt-1">{branch.subBranches.map((sub, j) => (<div key={sub.id} className="flex-1 relative flex flex-col items-center group"><div ref={el => { if (!subCardRefs.current[branch.id]) subCardRefs.current[branch.id] = {}; subCardRefs.current[branch.id][sub.id] = el; }} className="w-full py-3 px-1 text-center hover:-translate-y-1 transition-transform rounded-xl" style={{background:'var(--expense-bg)', boxShadow:'0 12px 26px rgba(34,37,43,0.15), 0 4px 10px rgba(34,37,43,0.09)', borderTop:'2px solid var(--expense)'}}><div className="font-num text-[15px] font-extrabold tracking-tight" style={{color:'var(--ink)'}}>{Number(sub.amount).toLocaleString()}</div>{sub.t1 && <div className="font-bold text-[11.5px] mt-1.5" style={{color:'var(--expense-deep)'}}>{sub.t1}</div>}{sub.t2 && <div className="font-medium text-[10.5px] mt-1" style={{color:'var(--ink-soft)'}}>{sub.t2}</div>}</div>{sub.note && (<div className="absolute top-full mt-3 left-1/2 -translate-x-1/2 w-max max-w-[140px] shadow-xl p-2.5 text-[11.5px] text-center leading-tight z-30 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none text-white rounded-lg" style={{background:'var(--ink)'}}><div className="absolute -top-1 left-1/2 -translate-x-1/2 w-2.5 h-2.5 rotate-45" style={{background:'var(--ink)'}}></div><span className="relative z-10">{sub.note}</span></div>)}</div>))}</div></div>)}
                      </div>
                    ))}</div>
                  </div>
                </div>
              </div>
              
              <div className="mt-20 pt-8 flex justify-between items-center w-full" style={{borderTop:'1.5px solid var(--line)'}}><div className="flex items-center gap-2.5 text-[13px] font-medium" style={{color:'var(--ink-soft)'}}><span className="w-1.5 h-1.5 rounded-full" style={{background:'var(--income)'}}></span>撿起散落的財務碎片，拼湊出夢想真實的形狀。</div><div className="px-5 py-2.5 rounded-full font-bold text-sm" style={{background:'var(--assets-bg)', color:'var(--assets-deep)'}}>專屬財務顧問 {advisorName}</div></div>
            </div>

            {/* 第二頁：財務規劃紀錄 */}
            <div ref={reportRef2} className="page-break p-14 xl:p-20 rounded-[2.5rem] w-[1440px] min-w-[1200px] print:w-full print:min-w-0 print:shadow-none print:p-14 relative flex flex-col" style={{background:'var(--card)', boxShadow:'0 28px 64px rgba(34,37,43,0.18), 0 6px 16px rgba(34,37,43,0.10)'}}>
              <div className="absolute top-0 right-0 w-[560px] h-[560px] rounded-full glow-blob pointer-events-none" style={{background:'radial-gradient(circle, var(--income-bg) 0%, rgba(255,255,255,0) 68%)', transform:'translate(30%,-40%)'}}></div>
              <div className="absolute bottom-0 left-0 w-[520px] h-[520px] rounded-full glow-blob pointer-events-none" style={{background:'radial-gradient(circle, var(--assets-bg) 0%, rgba(255,255,255,0) 68%)', transform:'translate(-25%,35%)'}}></div>
              
              <div className="text-center mb-16 relative z-10"><div className="flex w-fit items-center gap-2 px-4 py-1.5 rounded-full mb-4 mx-auto" style={{background:'var(--assets-bg)'}}><span className="w-1.5 h-1.5 rounded-full" style={{background:'var(--assets)'}}></span><span className="font-num text-[11px] font-bold tracking-[0.2em]" style={{color:'#37509e'}}>PAGE 2</span></div><h2 className="font-display text-2xl font-extrabold tracking-tight" style={{color:'var(--ink)'}}>{userName} 的財務規劃旅程</h2></div>
              
              <div className="relative z-10 flex-1 max-w-[880px] mx-auto w-full">
                {[{ label: '想完成的事', sub: 'GOALS', value: goals, tone: 'assets', Icon: IconTarget, ph: '例：3年內買房自住、45歲前存到退休金1000萬...' },{ label: '未來可能會遇到的事', sub: 'WHAT MAY COME', value: futureEvents, tone: 'assets', Icon: IconAlert, ph: '例：父母年邁的長照需求、換工作的收入空窗期...' },{ label: '理財盲點', sub: 'BLIND SPOTS', value: blindSpots, tone: 'assets', Icon: IconSearch, ph: '例：緊急預備金不足、保障集中在單一險種...' },].map((f, i) => (
                  <div key={i} className="flex gap-6"><div className="flex flex-col items-center"><div className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{background: '#eef1fd'}}><f.Icon color="#37509e" /></div><div className="w-px flex-1 my-2" style={{background:'var(--line)', minHeight:'24px'}}></div></div><div className="flex-1 pb-10"><div className="font-num text-[10.5px] font-bold tracking-[0.2em] uppercase mb-1" style={{color: '#37509e'}}>{f.sub}</div><h3 className="font-display text-[17px] font-extrabold mb-3" style={{color:'var(--ink)'}}>{f.label}</h3><div className="rounded-2xl p-5" style={{background:'var(--paper)', border:'1px solid var(--line)'}}><p className="text-[14.5px] leading-relaxed whitespace-pre-wrap" style={{color: f.value ? 'var(--ink-soft)' : '#c7c4ba'}}>{f.value || '（尚未填寫）'}</p></div></div></div>
                ))}
                <div className="flex gap-6"><div className="flex flex-col items-center"><div className="w-12 h-12 rounded-full flex items-center justify-center shrink-0" style={{background:'var(--assets-bg)'}}><IconBulb color="#37509e" /></div></div><div className="flex-1"><div className="font-num text-[10.5px] font-bold tracking-[0.2em] uppercase mb-1" style={{color:'var(--assets-deep)'}}>ADVICE</div><h3 className="font-display text-[17px] font-extrabold mb-3" style={{color:'var(--ink)'}}>理財建議</h3><div className="rounded-2xl p-5" style={{background:'var(--paper)', border:'1px solid var(--line)'}}><p className="text-[14.5px] leading-relaxed whitespace-pre-wrap" style={{color: advice ? 'var(--ink-soft)' : '#c7c4ba'}}>{advice || '（尚未填寫）'}</p></div></div></div>
              </div>
              
              <div className="mt-16 pt-8 flex justify-between items-center w-full relative z-10" style={{borderTop:'1.5px solid var(--line)'}}><div className="flex items-center gap-2.5 text-[13px] font-medium" style={{color:'var(--ink-soft)'}}><span className="w-1.5 h-1.5 rounded-full" style={{background:'var(--income)'}}></span>每一步規劃，都是為了讓未來的自己更安心。</div><div className="px-5 py-2.5 rounded-full font-bold text-sm" style={{background:'var(--assets-bg)', color:'var(--assets-deep)'}}>專屬財務顧問 {advisorName}</div></div>
            </div>
          </div>
        )}

      </div>

      {/* 保底的長按存圖視窗 */}
      {previewImage && (
        <div className="fixed inset-0 z-50 flex flex-col items-center justify-center p-5" style={{background:'rgba(20,24,35,0.82)'}} onClick={() => setPreviewImage(null)}>
          <div className="w-full max-w-2xl mb-4 text-center" onClick={e => e.stopPropagation()}>
            <p className="text-white font-bold text-base mb-1">📌 長按下方圖片，選擇「儲存到照片」或「加入照片」即可存檔</p>
            <p className="text-white/60 text-sm">如果剛剛已經自動跳出分享或下載視窗，這裡可以直接關閉</p>
          </div>
          <div className="max-w-2xl w-full overflow-auto rounded-2xl" style={{maxHeight:'70vh', background:'#ffffff'}} onClick={e => e.stopPropagation()}>
            <img src={previewImage.dataUrl} alt={previewImage.filename} style={{width:'100%', display:'block'}} />
          </div>
          <div className="flex gap-3 mt-5" onClick={e => e.stopPropagation()}>
            <a href={previewImage.dataUrl} download={previewImage.filename} className="px-6 py-3 rounded-full font-bold text-sm text-white" style={{background:'var(--assets)'}}>⬇ 再試一次自動下載</a>
            <button onClick={() => setPreviewImage(null)} className="px-6 py-3 rounded-full font-bold text-sm" style={{background:'rgba(255,255,255,0.15)', color:'#ffffff'}}>關閉</button>
          </div>
        </div>
      )}
    </div>
  );
};

const App = () => {
  const [session, setSession] = useState(undefined);
  const [configError, setConfigError] = useState(!SUPABASE_URL.startsWith('http'));

  useEffect(() => {
    if (!supabaseClient) { setSession(null); return; }
    supabaseClient.auth.getSession().then(({ data }) => setSession(data.session));
    const { data: listener } = supabaseClient.auth.onAuthStateChange((_event, newSession) => { setSession(newSession); });
    return () => listener.subscription.unsubscribe();
  }, []);

  if (configError) return (<div className="min-h-screen flex items-center justify-center p-6" style={{background:'var(--paper)'}}><div className="max-w-md p-8 rounded-3xl text-center" style={{background:'var(--card)', boxShadow:'0 20px 50px rgba(34,37,43,0.12)'}}><p className="font-bold text-base mb-2" style={{color:'var(--loan)'}}>⚠ 尚未設定資料庫連線</p><p className="text-sm" style={{color:'var(--ink-soft)'}}>請在程式碼開頭填入您的 Supabase 專案資訊。</p></div></div>);
  if (session === undefined) return <div className="min-h-screen flex items-center justify-center" style={{background:'var(--paper)'}}><p style={{color:'var(--ink-soft)'}}>載入中...</p></div>;
  if (!session) return <LoginScreen />;
  return <ReportApp key={session.user.id} session={session} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
